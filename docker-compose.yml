# The stack (STORY-015).
#
# NOT RUN. Docker is not installed on the machine these services were written
# on, so nothing below has been executed — reviewed, not verified.
#
# `docker compose up postgres` alone remains what it always was: a drop-in
# replacement for a Homebrew Postgres while you run the app with `npm run dev`.
#
#   docker compose up -d postgres     # just the database, as before
#   npm run db:reset
#
#   docker compose up                 # the whole stack (untested)

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: ale-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: author_launch_engine
    ports:
      - '5432:5432'
    volumes:
      - ale-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d author_launch_engine']
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    # Migrations run once, as their own unit, before anything serves.
    # Doing this in the API's entrypoint means N instances race to apply the
    # same DDL on every deploy — and readiness already refuses to serve an
    # instance whose schema is behind, which only works if something else is
    # responsible for moving it forward.
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ['node', 'server/src/db/migrate.js']
    environment:
      # The owner migrates; the app and worker below use the restricted login
      # (STORY-033), whose password this step sets from APP_DB_PASSWORD.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@postgres:5432/author_launch_engine
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD before running the stack}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before running the stack}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports: ['4000:4000']
    environment:
      DATABASE_URL: postgres://ale_app_login:${APP_DB_PASSWORD}@postgres:5432/author_launch_engine
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before running the stack}
      GIT_COMMIT: ${GIT_COMMIT:-}
      # This stack has no TLS terminator in front of nginx, so a browser
      # reaches it over http and enforcement would refuse every call. Off here;
      # set ENFORCE_HTTPS=true where a terminator sets X-Forwarded-Proto.
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile.worker
    environment:
      DATABASE_URL: postgres://ale_app_login:${APP_DB_PASSWORD}@postgres:5432/author_launch_engine
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before running the stack}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Safe to scale: STORY-011 gave every job a priority and an exclusive
    # resource, and STORY-065 made claiming and shutdown safe under concurrency.
    deploy:
      replicas: 1

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports: ['8080:8080']
    depends_on: [api]

# At the end, where it belongs (STORY-034). This block used to sit between
# `postgres` and `migrate`, so YAML read migrate, api, worker and client as
# *volumes* — the file defined one service, and `docker compose up` could only
# ever have started a database. Nobody noticed for nineteen stories because
# the file had never been run; the test suite now parses it the way Compose does.
volumes:
  ale-pgdata:
