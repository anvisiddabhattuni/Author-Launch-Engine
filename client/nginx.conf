# STORY-015; built and run since STORY-054. A template: at start the image
# fills ${NGINX_LOCAL_RESOLVERS} from the container's own DNS (Docker's or the
# cluster's) and ${ALE_API_UPSTREAM} from the environment; nginx's own $vars
# are left alone.

# STORY-061: load balancing across every API instance.
#
# `resolve` (open-source nginx since 1.27.3; this image is 1.30.5) re-reads the
# name every few seconds, so instances added or removed — `docker compose up
# --scale api=3`, or pods behind a headless Service — join and leave the pool
# without a restart. Round robin: each instance takes requests in turn, which is
# "evenly" for requests of similar cost.
#
# Health: open-source nginx has no active health checks (that is NGINX Plus).
# These are passive — an instance that fails 3 times is left out for 10 s — plus
# a retry on the next instance when one refuses or errors, so an instance that
# dies mid-traffic costs a retry, not an error page. The API's own /api/ready
# (STORY-015) is what Docker and Kubernetes use to take an instance out first.
upstream ale_api {
  zone ale_api 64k;
  resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
  server ${ALE_API_UPSTREAM} resolve max_fails=3 fail_timeout=10s;
  keepalive 16;
}

# The scheme the *client* used (STORY-034). Behind a TLS terminator that is
# the terminator's X-Forwarded-Proto, passed through; with nothing in front it
# is nginx's own. The API enforces HTTPS in production (STORY-031) and reads
# this header to decide — without it every browser call through nginx looked
# like plain http, and the stack refused its own UI.
map $http_x_forwarded_proto $client_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  # STORY-031. Generated from server/src/services/securityHeaders.js — the test
  # suite fails if these lines drift from it. `always` so error pages carry
  # them too. HSTS is sent here because in a container this sits behind the
  # TLS terminator; see the README before exposing 8080 directly.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Redirect plain http to https when the terminator says the client used it.
  # The two probe paths are exempt for the same reason as in the API.
  set $needs_https 0;
  if ($http_x_forwarded_proto = "http") { set $needs_https 1; }
  if ($request_uri ~ "^/api/(health|ready)$") { set $needs_https 0; }
  if ($needs_https) { return 308 https://$host$request_uri; }

  # A single-page app: every unknown path is a route the client owns, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API is a separate service. In development Vite proxies this; in a
  # container the two are different origins and something has to join them.
  location /api/ {
    proxy_pass http://ale_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # A refused connection or a 502/503 from one instance is retried on the next.
    # Only for requests safe to repeat: a POST that reached an instance is not
    # sent twice (nginx's default for non-idempotent methods).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    # A dead instance's address can linger in DNS for a few seconds. Without
    # this, a request sent there waited out nginx's 60 s default before trying
    # the next — found on the first live test (STORY-061), 1 request in 30.
    proxy_connect_timeout 3s;
    # Which instance answered, for the evenness check (STORY-061).
    add_header X-Upstream $upstream_addr always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
  }
}
