# STORY-015. NOT RUN — see server/Dockerfile.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # A single-page app: every unknown path is a route the client owns, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API is a separate service. In development Vite proxies this; in a
  # container the two are different origins and something has to join them.
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
