# STORY-062: `promtool test rules alerts.test.yml` — each alert fires on the
# series that should trip it, and stays quiet on one that should not.
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="ale-api", instance="api-1:4000"}'
        values: '1 1 0 0 0 0'
      - series: 'up{job="ale-api", instance="api-2:4000"}'
        values: '1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: AleApiDown
        exp_alerts: []
      - eval_time: 4m
        alertname: AleApiDown
        exp_alerts:
          - exp_labels: { severity: critical, job: ale-api, instance: 'api-1:4000' }
            exp_annotations:
              summary: 'API instance api-1:4000 is not answering'
              description: 'Prometheus has not been able to scrape api-1:4000 for a minute.'

  - interval: 1m
    input_series:
      - series: 'ale_jobs_oldest_queued_seconds{instance_name="a"}'
        values: '0+300x12'
    alert_rule_test:
      - eval_time: 3m
        alertname: AleJobBacklog
        exp_alerts: []
      - eval_time: 10m
        alertname: AleJobBacklog
        exp_alerts:
          - exp_labels: { severity: high, instance_name: a }
            exp_annotations:
              summary: 'Background work is falling behind'
              description: 'The oldest due job has waited 50m 0s — is a worker running, and are there enough?'

  - interval: 1m
    input_series:
      # 100 requests a minute, 20 of them 5xx: 20% errors.
      - series: 'ale_http_request_duration_seconds_count{status_class="2xx"}'
        values: '0+80x10'
      - series: 'ale_http_request_duration_seconds_count{status_class="5xx"}'
        values: '0+20x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AleErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: 'More than 5% of requests are failing'
              description: '20% of requests answered 5xx over five minutes.'

  - interval: 1m
    input_series:
      # Healthy: 1% errors — must not fire.
      - series: 'ale_http_request_duration_seconds_count{status_class="2xx"}'
        values: '0+99x10'
      - series: 'ale_http_request_duration_seconds_count{status_class="5xx"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AleErrorRate
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ale_integration_circuit_open{service="stripe"}'
        values: '0 0 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: AleIntegrationCircuitOpen
        exp_alerts:
          - exp_labels: { severity: high, service: stripe }
            exp_annotations:
              summary: 'stripe is failing — its circuit is open'
              description: 'Calls to stripe are paused after repeated failures (STORY-038).'
