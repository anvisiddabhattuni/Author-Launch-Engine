{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ale.dbHost" . }}
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ale.dbHost" . }}
  replicas: 1
  selector: { matchLabels: { app: {{ .Release.Name }}-postgres } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-postgres, ale-role: database }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: author_launch_engine
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "ale.secretName" . }}, key: owner-db-password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres, -d, author_launch_engine] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
{{- end }}
