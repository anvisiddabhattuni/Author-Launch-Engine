apiVersion: v1
kind: Service
metadata:
  # "api": the UI's nginx proxies /api to http://api:4000 (client/nginx.conf).
  name: api
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  # With autoscaling on, the HPA owns the count: setting it here too makes the
  # next upgrade after any scale-up fail with a field conflict (found in STORY-054).
  # Never below the running count during a rollout: a new pod must be ready
  # (migrations applied, database reachable) before an old one goes.
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: {{ .Release.Name }}-api } }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api, ale-role: app }
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      {{- include "ale.appPodSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "ale.image" (dict "root" . "name" "ale-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 4000 }]
          env:
            {{- include "ale.appEnv" . | nindent 12 }}
            - name: ENFORCE_HTTPS
              value: {{ .Values.api.enforceHttps | quote }}
          # Liveness restarts a stuck process; readiness keeps traffic off an
          # instance that is draining or whose schema is behind (STORY-015).
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/ready, port: 4000 }
            periodSeconds: 5
            failureThreshold: 2
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "ale.containerSecurity" . | nindent 10 }}
          volumeMounts: [{ name: audit-key, mountPath: /run/secrets/audit, readOnly: true }]
      volumes: {{- include "ale.auditKeyVolume" . | nindent 8 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector: { matchLabels: { app: {{ .Release.Name }}-api } }
{{ include "ale.hpa" (dict "root" . "name" "api" "spec" .Values.api) }}
