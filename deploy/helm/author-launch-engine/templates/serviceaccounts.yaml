{{/*
  One identity per component, none of which may call the Kubernetes API: the
  app never needs it, so a compromised pod gets no cluster access from its
  token — there is no token (STORY-054).
*/}}
{{- range $name := list "api" "worker" "migrate" "client" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {{- include "ale.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
