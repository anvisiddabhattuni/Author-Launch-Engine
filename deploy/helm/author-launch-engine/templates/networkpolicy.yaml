{{/*
  Only the app's own pods reach the database; only the UI and the app reach
  the API (STORY-054). Everything else in the cluster is refused at the network.
*/}}
{{- if .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { ale-role: database } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { ale-role: app } } }]
      ports: [{ port: 5432 }]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ale.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app: {{ .Release.Name }}-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { ale-role: web } }
        - podSelector: { matchLabels: { ale-role: app } }
        - podSelector: { matchLabels: { ale-role: dashboards } }
      ports: [{ port: 4000 }]
