{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
{{- if or (not $s.appDbPassword) (not $s.ownerDbPassword) (not $s.jwtSecret) (not $s.auditKey) }}
{{- fail "Set existingSecret, or all of secrets.appDbPassword, secrets.ownerDbPassword, secrets.jwtSecret and secrets.auditKey (STORY-054). The chart does not invent secrets: an upgrade would silently rotate them." }}
{{- end }}
{{- if and .Values.monitoring.enabled (not $s.alertmanagerToken) }}
{{- fail "monitoring.enabled needs secrets.alertmanagerToken (STORY-062)." }}
{{- end }}
{{- if and .Values.dashboards.enabled (not $s.grafanaAdminPassword) }}
{{- fail "dashboards.enabled needs secrets.grafanaAdminPassword (STORY-056)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ale.secretName" . }}
  labels: {{- include "ale.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-db-password: {{ $s.appDbPassword | quote }}
  owner-db-password: {{ $s.ownerDbPassword | quote }}
  jwt-secret: {{ $s.jwtSecret | quote }}
  audit-key: {{ $s.auditKey | quote }}
  {{- if .Values.dashboards.enabled }}
  grafana-admin-password: {{ $s.grafanaAdminPassword | quote }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
  alertmanager-token: {{ $s.alertmanagerToken | quote }}
  {{- end }}
{{- end }}
