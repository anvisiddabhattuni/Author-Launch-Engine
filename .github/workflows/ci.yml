# CI (STORY-015; tiers, end-to-end and dynamic scan added in STORY-053).
#
# THIS VERSION NOT RUN. The workflow HAS run once on GitHub — run 36269174542,
# 2026-09-26, on commit b24202f — and FAILED at `npm test`. Nobody knew: the
# README said it had never run. The likeliest cause, found by reproducing CI's
# conditions locally (STORY-053): databaseRoles.test.js granted the role
# `anvi` — the developer's own Postgres login — which does not exist on a CI
# runner, where the owner is `postgres`. Fixed; everything below is checked
# locally step for step by `npm run ci:local`, and the next push will say
# whether GitHub agrees.
#
# It stops at "the tests pass and the images build". There is no deploy job,
# because there is nothing to deploy to: no cloud account, no credentials, no
# environment. A deploy job that referenced secrets nobody has set would be a
# red X on every push pretending to be a pipeline.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # STORY-053. The unit tier: pure logic, no database, seconds. Everything
  # else waits on it, so a broken function fails the build before a database
  # is ever started.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The chart test (STORY-054) renders the Helm chart; without helm it skips.
      - uses: azure/setup-helm@v4
      - run: npm run test:unit

  test:
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        # Matches the version the migrations are written against. A CI database
        # on a different major version tests something nobody runs.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: author_launch_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d author_launch_engine"
          --health-interval 5s --health-timeout 5s --health-retries 10

      # STORY-039. The broker the story names, so tests/messageBus.test.js runs
      # its RabbitMQ scenario here — it reports itself skipped anywhere
      # AMQP_URL is unset, which includes the machine it was written on.
      rabbitmq:
        image: rabbitmq:3.13-alpine@sha256:d7af1c87c5f1eda13fcfca06db452bf3aeab6619fc3358b68535c0c02c4e52bc
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10

    env:
      # Two connections (STORY-033). Migrations as the owner; the app and the
      # tests as the restricted login, so CI proves the product works without
      # the power to rewrite its own audit log.
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/author_launch_engine
      DATABASE_URL: postgres://ale_app_login:ci-app-password@localhost:5432/author_launch_engine
      APP_DB_PASSWORD: ci-app-password
      AMQP_URL: amqp://guest:guest@localhost:5672
      # The API refuses to start in production without this, which is the point
      # of that check — so CI has to set one rather than the check being untested.
      JWT_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # STORY-034. The vulnerability scan that can run without Docker: every
      # dependency the production image ships, against the advisory database.
      # Fails the build on anything moderate or worse; there were three
      # (qs, via Express) when this was added, and they were fixed, not muted.
      - name: Scan production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run db:reset
      # The integration tier: the API against a real Postgres, as the app's
      # restricted login. `npm test` is both tiers.
      - run: npm test

      # The suites share one database and several assert on cross-suite
      # behaviour, so a single green run is weaker evidence than it looks. Three
      # runs is what caught two latent flakes during STORY-013 and STORY-014.
      - name: Run the suite three times
        run: |
          for i in 1 2 3; do
            npm run db:reset
            npm test
          done

      - run: npm run build --workspace client
      - name: The demo must run end to end
        run: npm run db:reset && npm run demo

  # STORY-053. The end-to-end tier: a person's journey through the production
  # build in Chrome — sign in, upload, drafts compared with the book, request
  # changes, approve, an API key shown once, compliance refused — then every
  # tab under the enforced CSP at phone and desktop widths (STORY-031).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: author_launch_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d author_launch_engine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/author_launch_engine
      DATABASE_URL: postgres://ale_app_login:ci-app-password@localhost:5432/author_launch_engine
      APP_DB_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-not-a-secret
      # Chrome ships on GitHub's Ubuntu runners.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:reset && npm run test:e2e
      - run: npm run db:reset && npm run demo && npm run check:browser

  # STORY-053. A dynamic security scan: OWASP ZAP's baseline against the
  # running production build and API — headers, cookies, information leaks,
  # the things a static scan of dependencies cannot see. Rule levels are in
  # .zap/rules.tsv, reviewed; anything at FAIL fails the build.
  security:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: author_launch_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d author_launch_engine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/author_launch_engine
      DATABASE_URL: postgres://ale_app_login:ci-app-password@localhost:5432/author_launch_engine
      APP_DB_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:reset && npm run build --workspace client
      - name: Start the API and the production build
        run: |
          (npm start --workspace server > api.log 2>&1 &)
          (npx --workspace client vite preview --port 4173 --strictPort > ui.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health && curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat api.log ui.log; exit 1
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:4173
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          fail_action: true
          allow_issue_writing: false
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_*.*

  # STORY-055 / STORY-056. Elasticsearch and Grafana, for real. They are not
  # run on the developer's machine (8 GB, and a JVM beside Postgres, the API
  # and a browser does not fit), so this job is where the acceptance criteria
  # are checked: indexing at volume, answers under a second, loss and damage
  # found and repaired, the dashboard's panels answering over a chosen range,
  # and a customised panel saved, seen at once, and kept across a restart.
  # NOT RUN YET — the first push will say whether it passes.
  search:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: author_launch_engine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d author_launch_engine"
          --health-interval 5s --health-timeout 5s --health-retries 10
      elasticsearch:
        # Pinned by tag. The digest is filled in from the registry on the first
        # run, not written from memory (see deploy/Caddyfile's note, STORY-030).
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          # Reached only from this runner. In a cluster the NetworkPolicy does
          # this job (deploy/helm, STORY-054); see the README for turning
          # Elasticsearch's own security on.
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/author_launch_engine
      DATABASE_URL: postgres://ale_app_login:ci-app-password@localhost:5432/author_launch_engine
      APP_DB_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-not-a-secret
      ELASTICSEARCH_URL: http://localhost:9200
      SEARCH_VOLUME: '20000'
      GRAFANA_URL: http://localhost:3000
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:reset

      - name: STORY-055 — aggregated, searchable in under a second, nothing lost
        working-directory: server
        run: node --test tests/searchLive.test.js

      - name: Start Grafana with the provisioned trust dashboard
        run: |
          G=deploy/helm/author-launch-engine/files/grafana
          docker run -d --name grafana --network host \
            -e GF_SECURITY_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" \
            -e GF_AUTH_ANONYMOUS_ENABLED=false \
            -e ELASTICSEARCH_URL="$ELASTICSEARCH_URL" \
            -v "$PWD/$G/datasources:/etc/grafana/provisioning/datasources:ro" \
            -v "$PWD/$G/dashboards:/etc/grafana/provisioning/dashboards:ro" \
            -v grafana-data:/var/lib/grafana \
            grafana/grafana:11.2.2
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 2; done
          docker logs grafana; exit 1

      - name: STORY-056 — panels over a chosen range; a customised panel is saved
        working-directory: server
        run: node --test tests/grafanaLive.test.js

      - name: STORY-056 — and the customisation outlives a restart
        working-directory: server
        run: |
          docker restart grafana
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 2; done
          GRAFANA_AFTER_RESTART=1 node --test tests/grafanaLive.test.js

      - name: Screenshots from the browser
        run: |
          npm run db:reset && npm run demo > /dev/null && npm run search:aggregate
          npm run build --workspace client
          (npm start --workspace server > api.log 2>&1 &)
          (npx --workspace client vite preview --port 4173 --strictPort > ui.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/api/health > /dev/null && curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          SHOTS_DIR=shots node client/scripts/searchShots.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-055-056-screenshots
          path: |
            shots/
            api.log
          if-no-files-found: ignore

  # STORY-060. Horizontal scaling, proven on a real Kubernetes cluster (kind)
  # on every push: the chart installs, and under load the API autoscaler adds
  # pods. EKS (deploy/eks/cluster.yaml) is the same chart on a paid cluster.
  kubernetes:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with: { cluster_name: ale }
      - name: metrics-server (what autoscalers read)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
      - name: Build and load the images
        run: |
          docker build -f server/Dockerfile -t ale-api:ci .
          docker build -f server/Dockerfile.worker -t ale-worker:ci .
          docker build -f client/Dockerfile -t ale-client:ci .
          kind load docker-image ale-api:ci ale-worker:ci ale-client:ci --name ale
      - name: Install the chart
        run: |
          kubectl create namespace ale
          helm install ale deploy/helm/author-launch-engine -n ale --wait --timeout 8m \
            --set image.tag=ci --set image.pullPolicy=Never \
            --set secrets.appDbPassword=ci-app --set secrets.ownerDbPassword=ci-owner \
            --set secrets.jwtSecret=ci-only-jwt-secret --set secrets.auditKey=$(openssl rand -base64 32) \
            --set api.autoscaling.maxReplicas=4 --set api.autoscaling.targetCPUUtilizationPercentage=30
          kubectl -n ale get hpa
      - name: STORY-060 — under load, more pods are deployed automatically
        run: |
          before=$(kubectl -n ale get deploy ale-api -o jsonpath='{.status.replicas}')
          echo "API pods before load: $before"
          kubectl -n ale run load --image=busybox:1.36 --restart=Never --labels=ale-role=web -- \
            sh -c 'for w in 1 2 3 4 5 6 7 8; do (while true; do wget -qO- http://api:4000/api/ready >/dev/null 2>&1; done) & done; wait'
          for i in $(seq 1 40); do
            n=$(kubectl -n ale get deploy ale-api -o jsonpath='{.status.replicas}')
            echo "t+$((i*10))s replicas=$n $(kubectl -n ale get hpa ale-api --no-headers | awk '{print $3}')"
            if [ "$n" -gt "$before" ]; then kubectl -n ale describe hpa ale-api | grep -i rescale; exit 0; fi
            sleep 10
          done
          echo "the autoscaler did not add pods under load"; kubectl -n ale describe hpa ale-api; exit 1

  # STORY-061. NGINX spreads requests evenly across API instances and routes
  # around one that dies. The same test ran on the AWS server by hand.
  loadbalancer:
    runs-on: ubuntu-latest
    needs: unit
    env:
      APP_DB_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - name: Three API instances behind nginx
        run: |
          mkdir -p server/.keys && openssl rand -base64 32 > server/.keys/audit.key && sudo chown 10001:10001 server/.keys/audit.key && sudo chmod 400 server/.keys/audit.key
          printf 'services:\n  postgres: { ports: !reset [] }\n  api:\n    ports: !reset []\n    deploy: { replicas: 3 }\n' > lb.yml
          docker compose -f docker-compose.yml -f lb.yml up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/ready >/dev/null && break; sleep 2; done
          sleep 5; docker compose -f docker-compose.yml -f lb.yml ps
      - name: STORY-061 — evenly, and around a failed instance
        run: |
          count() { for i in $(seq $1); do curl -s http://127.0.0.1:8080/api/ready | grep -o '"instance":"[^"]*"'; done | sort | uniq -c; }
          echo "== 60 requests"; count 60 | tee even.txt
          [ "$(wc -l < even.txt)" -eq 3 ] || { echo "not all three instances answered"; exit 1; }
          awk '{ if ($1 < 18 || $1 > 22) bad=1 } END { exit bad }' even.txt || { echo "not even"; exit 1; }
          victim=$(docker ps --filter name=api --format '{{.Names}}' | head -1)
          (sleep 1; docker kill "$victim") &
          ok=0; for i in $(seq 1000); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/ready)" = 200 ] && ok=$((ok+1)); done; wait
          echo "while $victim was killed: $ok of 1000 answered"
          [ "$ok" -ge 995 ] || exit 1

  # STORY-062. The alert rules fire when they should (promtool), Prometheus
  # scrapes the API, and an alert travels Alertmanager → API → an anomaly
  # escalated to the operators.
  monitoring:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: author_launch_engine }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d author_launch_engine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/author_launch_engine
      DATABASE_URL: postgres://ale_app_login:ci-app-password@localhost:5432/author_launch_engine
      APP_DB_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-not-a-secret
      ALERTMANAGER_TOKEN: ci-alertmanager-token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci && npm run db:reset
      - name: The rules fire when they should, and not when they should not
        run: |
          docker run --rm -v "$PWD/deploy/helm/author-launch-engine/files/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v2.53.0 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/helm/author-launch-engine/files/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v2.53.0 test rules alerts.test.yml
      - name: Prometheus scrapes the API
        run: |
          (npm start --workspace server > api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:4000/api/health >/dev/null && break; sleep 1; done
          mkdir -p /tmp/prom && cp deploy/helm/author-launch-engine/files/prometheus/*.yml /tmp/prom/
          sed -i "s/'api:4000'/'localhost:4000'/; s/'alertmanager:9093'/'localhost:9093'/" /tmp/prom/prometheus.yml
          docker run -d --name prom --network host -v /tmp/prom:/etc/prometheus prom/prometheus:v2.53.0 --config.file=/etc/prometheus/prometheus.yml
          for i in $(seq 1 30); do
            up=$(curl -s 'localhost:9090/api/v1/query?query=up%7Bjob%3D%22ale-api%22%7D' | grep -o '"value":\[[^]]*"1"\]' || true)
            [ -n "$up" ] && { echo "target up: $up"; break; }; sleep 2
          done
          [ -n "$up" ] || { curl -s localhost:9090/api/v1/targets; exit 1; }
          curl -s localhost:9090/api/v1/rules | grep -o '"name":"Ale[A-Za-z]*"' | sort -u
      - name: An alert reaches a person, through Alertmanager and the API
        run: |
          printf '%s' "$ALERTMANAGER_TOKEN" > /tmp/prom/token
          sed "s#http://api:4000#http://localhost:4000#; s#/etc/alertmanager/token#/etc/alertmanager/token#" /tmp/prom/alertmanager.yml > /tmp/prom/am.yml
          docker run -d --name am --network host -v /tmp/prom/am.yml:/etc/alertmanager/alertmanager.yml -v /tmp/prom/token:/etc/alertmanager/token prom/alertmanager:v0.27.0 --config.file=/etc/alertmanager/alertmanager.yml
          for i in $(seq 1 20); do curl -sf localhost:9093/-/ready && break; sleep 1; done
          curl -s -XPOST localhost:9093/api/v2/alerts -H 'content-type: application/json' \
            -d '[{"labels":{"alertname":"AleJobBacklog","severity":"high","instance_name":"ci"},"annotations":{"summary":"Background work is falling behind (CI)"}}]'
          for i in $(seq 1 60); do
            n=$(psql "$MIGRATION_DATABASE_URL" -tAc "SELECT COUNT(*) FROM anomaly_events WHERE detector = 'prometheus.AleJobBacklog' AND escalated_at IS NOT NULL")
            [ "$n" -ge 1 ] && { echo "alert recorded and escalated"; psql "$MIGRATION_DATABASE_URL" -c "SELECT detector, summary, escalated_to FROM anomaly_events"; exit 0; }
            sleep 2
          done
          docker logs am | tail -20; tail -30 api.log; exit 1

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      # Build only. Pushing needs a registry and credentials that do not exist,
      # and building is what catches a broken Dockerfile — which is the failure
      # these files are most likely to have, never having been built.
      - run: docker build -f server/Dockerfile -t ale-api:${{ github.sha }} .
      - run: docker build -f server/Dockerfile.worker -t ale-worker:${{ github.sha }} .
      - run: docker build -f client/Dockerfile -t ale-client:${{ github.sha }} .

      # STORY-034 — image scanning with Clair, as the story asks. NOT RUN, like
      # everything in this file: written against quay/clair-action's action.yaml
      # as published, pinned to the release current when it was written.
      #
      # `return-code: '1'` is the line that matters. The action's default is
      # '0' — it reports vulnerabilities and passes the build anyway — so the
      # example in its own README is a scan that can never fail CI.
      #
      # The first real run (2026-09-30) failed without scanning anything: "no
      # $DB_PATH / --db-path or $DB_URL / --db-url set". Clair's vulnerability
      # database is not hosted anywhere (the action's README says so); a
      # pipeline must build it in `update` mode first. Cached per day, so a
      # push rebuilds it at most once a day and scans against fresh data.
      - name: Save images for scanning
        run: |
          docker save -o api.tar ale-api:${{ github.sha }}
          docker save -o worker.tar ale-worker:${{ github.sha }}
          docker save -o client.tar ale-client:${{ github.sha }}
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Today's vulnerability database, if already built
        id: clairdb
        uses: actions/cache@v4
        with: { path: matcher.db, key: 'clair-matcher-${{ env.today }}' }
      # One feed timing out (Red Hat's rhel-vex, 2026-10-06 — not a base any
      # of these images uses) failed the whole job before a single image was
      # scanned. A second try picks up where the first stopped; if that also
      # fails, the job fails, so no scan ever runs on a half-built database.
      - name: Build the vulnerability database
        id: clairupdate
        if: steps.clairdb.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: quay/clair-action@v0.0.16
        with: { mode: update, db-file: matcher.db }
      - name: Build the vulnerability database (second try)
        if: steps.clairdb.outputs.cache-hit != 'true' && steps.clairupdate.outcome == 'failure'
        uses: quay/clair-action@v0.0.16
        with: { mode: update, db-file: matcher.db }
      - name: Scan the API image
        uses: quay/clair-action@v0.0.16
        with: { image-path: api.tar, db-file: matcher.db, format: sarif, output: clair-api.sarif, return-code: '1' }
      - name: Scan the worker image
        if: always()
        uses: quay/clair-action@v0.0.16
        with: { image-path: worker.tar, db-file: matcher.db, format: sarif, output: clair-worker.sarif, return-code: '1' }
      - name: Scan the client image
        if: always()
        uses: quay/clair-action@v0.0.16
        with: { image-path: client.tar, db-file: matcher.db, format: sarif, output: clair-client.sarif, return-code: '1' }
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clair-reports
          path: clair-*.sarif
